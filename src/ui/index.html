<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manufacturing Scheduler</title>
<style>
body{font:14px system-ui,sans-serif;margin:0;color:#1d1d1f;background:#f6f6f7}
header{background:#1f2937;color:#fff;padding:10px 16px;font-size:16px}
main{display:grid;grid-template-columns:360px 1fr;gap:12px;padding:12px}
section{background:#fff;border:1px solid #d9d9de;border-radius:6px;padding:10px;margin-bottom:12px}
h2{font-size:14px;margin:0 0 8px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border-bottom:1px solid #eee;padding:3px 5px;text-align:left;vertical-align:top}
tr.run{cursor:pointer}
tr.sel{background:#e0ecff}
.ok{color:#0a7a2f;font-weight:600}.bad{color:#b42318;font-weight:600}.na{color:#777}
input,select,button{font:inherit;padding:3px 5px;margin:2px 0}
label{display:block;font-size:12px;margin-top:4px}
#gantt{overflow:auto;max-height:520px;border:1px solid #eee}
.row{display:flex;align-items:center;height:20px;border-bottom:1px solid #f0f0f0}
.lab{flex:0 0 76px;font-size:11px;padding-left:4px;position:sticky;left:0;background:#fff;z-index:1}
.track{position:relative;flex:0 0 1400px;height:16px}
.bar{position:absolute;top:1px;height:14px;border-radius:2px;opacity:.9}
pre{margin:0;font-size:11px;max-height:260px;overflow:auto;background:#fafafa;padding:6px}
.msg{font-size:12px;margin-top:6px}
.scroll{max-height:240px;overflow:auto}
</style>
</head>
<body>
<header>Manufacturing Scheduler</header>
<main>
  <div>
    <section>
      <h2>Runs</h2>
      <div class="scroll"><table id="runs"></table></div>
      <div>
        <select id="rule"><option>CRITICAL_RATIO</option><option>PRIORITY_EDD</option><option>EDD</option></select>
        <button id="newBase">New baseline</button>
      </div>
      <div class="msg" id="msgRuns"></div>
    </section>
    <section>
      <h2>Reschedule selected run</h2>
      <label>Machine <select id="machine"></select></label>
      <label>Trigger time <input id="trig" value="2026-11-02 00:00:00" size="19"></label>
      <label>Downtime start <input id="ds" value="2026-11-03 06:00:00" size="19"></label>
      <label>Downtime end <input id="de" value="2026-11-03 18:00:00" size="19"></label>
      <label>Reason <input id="why" value="Breakdown from UI" size="24"></label>
      <button id="resched">Reschedule</button>
      <div class="msg" id="msgRe"></div>
    </section>
    <section>
      <h2>Compare two runs</h2>
      <select id="ca"></select> to <select id="cb"></select>
      <button id="cmp">Compare</button>
      <pre id="cmpOut"></pre>
    </section>
  </div>
  <div>
    <section>
      <h2 id="title">Select a run</h2>
      <button id="validate">Validate</button>
      <div class="msg" id="msgRun"></div>
    </section>
    <section><h2>KPIs</h2><div class="scroll"><table id="kpis"></table></div></section>
    <section><h2>Schedule (hover a bar for details)</h2><div id="gantt"></div></section>
    <section><h2>Violations and exceptions</h2><div class="scroll"><table id="exc"></table></div></section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const ts = s => Date.parse(s.replace(" ", "T") + "Z");
let current = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  const t = await r.text();
  let b; try { b = JSON.parse(t); } catch { b = t; }
  if (!r.ok) {
    const d = b && b.detail;
    throw new Error(d ? (typeof d === "string" ? d : JSON.stringify(d)) : t);
  }
  return b;
}
function cell(tr, text, cls) {
  const td = document.createElement("td");
  td.textContent = text; if (cls) td.className = cls; tr.appendChild(td);
}
function fillTable(t, header, rows) {
  t.replaceChildren();
  const h = document.createElement("tr");
  header.forEach(x => { const th = document.createElement("th"); th.textContent = x; h.appendChild(th); });
  t.appendChild(h);
  rows.forEach(r => t.appendChild(r));
}
const labelClass = l => l === "FEASIBLE" ? "ok" : l === "INFEASIBLE_VIOLATIONS" ? "bad" : "na";
function setMsg(id, text, bad) { const e = $(id); e.textContent = text; e.className = "msg " + (bad ? "bad" : ""); }

async function loadRuns(selectId) {
  const runs = await api("/runs");
  const rows = runs.map(r => {
    const tr = document.createElement("tr");
    tr.className = "run" + (r.run_id === current ? " sel" : "");
    cell(tr, r.run_id.slice(-6)); cell(tr, r.run_type); cell(tr, r.scheduling_rule);
    cell(tr, r.feasibility_label, labelClass(r.feasibility_label));
    tr.onclick = () => selectRun(r.run_id);
    return tr;
  });
  fillTable($("runs"), ["Run", "Type", "Rule", "Label"], rows);
  for (const id of ["ca", "cb"]) {
    $(id).replaceChildren(...runs.map(r => new Option(r.run_id, r.run_id)));
  }
  if (runs.length > 1) $("cb").value = runs[runs.length - 1].run_id;
  if (selectId) selectRun(selectId);
  else if (!current && runs.length) selectRun(runs[0].run_id);
}

async function selectRun(id) {
  current = id;
  [...$("runs").querySelectorAll("tr.run")].forEach(tr =>
    tr.classList.toggle("sel", tr.firstChild.textContent === id.slice(-6)));
  $("title").textContent = id;
  setMsg("msgRun", "Loading...");
  try {
    const [run, kpis, exc] = await Promise.all([
      api("/runs/" + id), api("/runs/" + id + "/metrics"), api("/runs/" + id + "/exceptions")]);
    $("title").textContent = `${id} - ${run.run_type}, ${run.scheduling_rule}, ${run.feasibility_label}` +
      `, ${run.scheduled_operations} operations`;
    fillTable($("kpis"), ["KPI", "Value"], Object.entries(kpis).map(([k, v]) => {
      const tr = document.createElement("tr");
      cell(tr, k); cell(tr, v !== null && typeof v === "object" ? JSON.stringify(v) : String(v));
      return tr;
    }));
    fillTable($("exc"), ["Code", "Severity", "Operation", "Machine", "Message"],
      exc.slice(0, 300).map(e => {
        const tr = document.createElement("tr");
        cell(tr, e.code); cell(tr, e.severity); cell(tr, e.operation_id || "");
        cell(tr, e.machine_id || ""); cell(tr, e.message);
        return tr;
      }));
    setMsg("msgRun", exc.length > 300 ? `Showing 300 of ${exc.length} exceptions` : "");
    await drawGantt(id);
  } catch (e) { setMsg("msgRun", e.message, true); }
}

async function drawGantt(id) {
  let rows = [], offset = 0;
  for (;;) {
    const page = await api(`/runs/${id}/schedule?limit=1000&offset=${offset}`);
    rows = rows.concat(page);
    if (page.length < 1000) break;
    offset += 1000;
  }
  const g = $("gantt"); g.replaceChildren();
  if (!rows.length) { g.textContent = "No scheduled operations."; return; }
  const lo = Math.min(...rows.map(r => ts(r.setup_start)));
  const hi = Math.max(...rows.map(r => ts(r.end_time)));
  const span = Math.max(hi - lo, 1);
  const byMachine = {};
  rows.forEach(r => (byMachine[r.machine_id] ||= []).push(r));
  const machines = Object.keys(byMachine).sort();
  const keep = $("machine").value;
  $("machine").replaceChildren(...machines.map(m => new Option(m, m)));
  if (machines.includes(keep)) $("machine").value = keep;
  const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
  machines.forEach(m => {
    const row = document.createElement("div"); row.className = "row";
    const lab = document.createElement("div"); lab.className = "lab"; lab.textContent = m;
    const track = document.createElement("div"); track.className = "track";
    byMachine[m].forEach(r => {
      const bar = document.createElement("div"); bar.className = "bar";
      const a = ts(r.setup_start), b = ts(r.end_time);
      bar.style.left = ((a - lo) / span * 100) + "%";
      bar.style.width = Math.max((b - a) / span * 100, 0.1) + "%";
      bar.style.background = `hsl(${hue(r.order_id)},60%,55%)`;
      bar.title = `${r.operation_id}\nsetup ${r.setup_minutes} min from ${r.setup_start}\n` +
                  `runs ${r.start_time} to ${r.end_time}`;
      track.appendChild(bar);
    });
    row.append(lab, track); g.appendChild(row);
  });
}

$("newBase").onclick = async () => {
  setMsg("msgRuns", "Building baseline...");
  $("newBase").disabled = true;
  try {
    const r = await api("/runs/baseline", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ rule: $("rule").value }) });
    setMsg("msgRuns", `Created ${r.run_id}: ${r.feasibility_label}`);
    await loadRuns(r.run_id);
  } catch (e) { setMsg("msgRuns", e.message, true); }
  $("newBase").disabled = false;
};
$("validate").onclick = async () => {
  if (!current) return;
  try {
    const r = await api(`/runs/${current}/validate`, { method: "POST" });
    setMsg("msgRun", `${r.feasibility_label}, ${r.violation_count} violations`);
    await loadRuns(current);
  } catch (e) { setMsg("msgRun", e.message, true); }
};
$("resched").onclick = async () => {
  if (!current) return;
  setMsg("msgRe", "Rescheduling...");
  $("resched").disabled = true;
  try {
    const r = await api(`/runs/${current}/reschedule`, { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ trigger_time: $("trig").value, why: $("why").value,
        downtimes: [{ machine_id: $("machine").value, down_start: $("ds").value, down_end: $("de").value }] }) });
    setMsg("msgRe", `Created ${r.run_id}: ${r.feasibility_label}, ${r.violation_count} violations`);
    await loadRuns(r.run_id);
  } catch (e) { setMsg("msgRe", e.message, true); }
  $("resched").disabled = false;
};
$("cmp").onclick = async () => {
  try {
    const r = await api(`/runs/compare?a=${$("ca").value}&b=${$("cb").value}`);
    $("cmpOut").textContent = JSON.stringify(r, null, 2);
  } catch (e) { $("cmpOut").textContent = e.message; }
};
loadRuns().catch(e => setMsg("msgRuns", e.message, true));
</script>
</body>
</html>
